name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Test source and standalone artifact
        env:
          GIT_HOOK_PURE_REQUIRE_NON_C_COLLATION: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
        run: mise run test
